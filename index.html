<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemoDirector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <script>
      // Polyfills for Node.js globals
      window.global = window;
      window.process = { 
        env: { NODE_ENV: 'production' },
        nextTick: function(fn) { setTimeout(fn, 0); },
        version: ''
      };
    </script>
    <!-- Polyfill Buffer: specific version known to work well -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script>
      if (window.buffer) {
        window.Buffer = window.buffer.Buffer;
      }
    </script>
    <!-- Export Libraries -->
    <script>
      // UMD Fix: Temporarily hide define/module/exports to force libraries to attach to window
      window._oldDefine = window.define;
      window.define = undefined;
      window._oldModule = window.module;
      window.module = undefined;
      window._oldExports = window.exports;
      window.exports = undefined;
    </script>
    <!-- Use jsDelivr for better stability than unpkg -->
    <script src="https://cdn.jsdelivr.net/npm/anki-apkg-export@5.3.2/dist/anki-apkg-export.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script>
      // Restore AMD/CommonJS if they existed
      window.define = window._oldDefine;
      window.module = window._oldModule;
      window.exports = window._oldExports;
    </script>
    <style>
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #0f172a; /* slate-900 */
        color: #f8fafc;
      }
      .font-mono {
        font-family: 'Source Code+Pro', monospace;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
    </style>

{
  "imports": {
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",

  }
}
</script>
