<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemoDirector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <script>
      window.global = window;
      window.process = {
        env: { NODE_ENV: 'production' },
        nextTick: function(fn) { setTimeout(fn, 0); },
        version: ''
      };
    </script>
    <script src="https://bundle.run/buffer@6.0.3"></script>
    <script>
      (function() {
        if (typeof window.Buffer === 'undefined' && window.buffer && window.buffer.Buffer) {
          window.Buffer = window.buffer.Buffer;
        }
        if (window.Buffer) {
          window.global.Buffer = window.Buffer;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
