<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemoDirector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <script>
      // Polyfills for Node.js globals
      window.global = window;
      window.process = { 
        env: { NODE_ENV: 'production' },
        nextTick: function(fn) { setTimeout(fn, 0); },
        version: ''
      };
    </script>
    <!-- Polyfill Buffer: Robust loading -->
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.min.js"></script>
    <script>
      // Ensure Buffer is available globally on window
      if (typeof window.Buffer === 'undefined' && window.buffer) {
        window.Buffer = window.buffer.Buffer;
      }
      if (window.Buffer) {
        window.global.Buffer = window.Buffer;
      }
    </script>

    <style>
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #0f172a; /* slate-900 */
        color: #f8fafc;
      }
      .font-mono {
        font-family: 'Source Code+Pro', monospace;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      /* Toast Animation */
      @keyframes slide-in {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      .animate-slide-in {
        animation: slide-in 0.3s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
